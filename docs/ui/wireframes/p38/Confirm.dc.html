<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 390px; height: 844px; font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; color: #171717; overflow: hidden; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 0; }
.success-ring { width: 100px; height: 100px; border-radius: 50px; background: #f0fdf4; border: 3px solid #86efac; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 20px; }
.title { font-size: 26px; font-weight: 700; color: #171717; margin-bottom: 6px; }
.invoice-no { font-size: 14px; color: #737373; margin-bottom: 24px; }
.summary-card { width: 100%; background: #fff; border-radius: 14px; border: 1px solid #e5e5e5; overflow: hidden; margin-bottom: 24px; }
.sum-row { display: flex; padding: 12px 16px; border-bottom: 1px solid #f5f5f5; }
.sum-row:last-child { border-bottom: none; }
.sum-lbl { font-size: 13px; color: #737373; width: 90px; flex-shrink: 0; }
.sum-val { font-size: 14px; font-weight: 500; flex: 1; }
.sum-total { display: flex; padding: 14px 16px; background: #fafafa; }
.sum-total-lbl { flex: 1; font-size: 16px; font-weight: 700; }
.sum-total-val { font-size: 22px; font-weight: 700; color: #16a34a; }
.action-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.act-btn { padding: 13px 10px; border-radius: 11px; text-align: center; font-size: 13px; font-weight: 600; border: 1px solid #e5e5e5; background: #fff; color: #404040; }
.act-btn.whatsapp { background: #dcfce7; color: #15803d; border-color: #86efac; }
.full-btn { width: 100%; padding: 14px; border-radius: 12px; text-align: center; font-size: 15px; font-weight: 600; }
.new-sale-btn { background: #2563eb; color: #fff; margin-bottom: 8px; }
.home-btn { background: #fff; color: #404040; border: 1px solid #e5e5e5; }
</style>
<div class="success-ring">✓</div>
<div class="title">Sale recorded!</div>
<div class="invoice-no">Invoice #1049 · 1 Sep 2026, 2:34 PM</div>
<div class="summary-card">
  <div class="sum-row"><div class="sum-lbl">Customer</div><div class="sum-val">Walk-in customer</div></div>
  <div class="sum-row"><div class="sum-lbl">Items</div><div class="sum-val">Amul Butter ×5, Tata Salt ×10</div></div>
  <div class="sum-row"><div class="sum-lbl">Payment</div><div class="sum-val">Cash · Received in full</div></div>
  <div class="sum-row"><div class="sum-lbl">Recorded by</div><div class="sum-val">Sanjay (Manager)</div></div>
  <div class="sum-total">
    <div class="sum-total-lbl">Total</div>
    <div class="sum-total-val">₹1,500</div>

</div>
<div class="action-grid">

  <div class="act-btn">🖨 Print receipt</div>
</div>
<div class="full-btn new-sale-btn">+ New sale</div>
<div class="full-btn home-btn">Go to home</div>
