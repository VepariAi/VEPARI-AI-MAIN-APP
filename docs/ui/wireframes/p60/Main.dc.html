<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Onboarding — Splash</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 390px; height: 844px;
  font-family: 'Inter', system-ui, sans-serif;
  background: #FAF7F2;
  color: #3B2F2A;
  overflow: hidden;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative;
}

/* Corner bracket decorations */
.corner { position: absolute; width: 32px; height: 32px; }
.corner.tl { top: 24px; left: 24px; }
.corner.tr { top: 24px; right: 24px; }
.corner.bl { bottom: 80px; left: 24px; }
.corner.br { bottom: 80px; right: 24px; }

.hero { display: flex; flex-direction: column; align-items: center; gap: 0; }

/* Lotus mandala ring */
.lotus-ring {
  width: 120px; height: 120px;
  border-radius: 50%;
  border: 1.5px solid rgba(200,169,107,0.3);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  margin-bottom: 28px;
}
.lotus-ring::before {
  content: '';
  position: absolute;
  width: 100px; height: 100px;
  border-radius: 50%;
  border: 1px solid rgba(200,169,107,0.5);
}
.lotus-ring::after {
  content: '';
  position: absolute;
  width: 136px; height: 136px;
  border-radius: 50%;
  border: 0.5px dashed rgba(200,169,107,0.2);
}
.lotus-icon {
  width: 72px; height: 72px;
  display: flex; align-items: center; justify-content: center;
}

.wordmark {
  font-size: 32px;
  font-weight: 700;
  color: #3B2F2A;
  letter-spacing: -0.5px;
  margin-bottom: 4px;
  text-align: center;
}
.wordmark span { color: #C8A96B; }
.tagline-sub {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #8A7060;
  margin-bottom: 40px;
  text-align: center;
}

.tagline-main {
  font-size: 14px;
  font-weight: 400;
  color: #8A7060;
  text-align: center;
  line-height: 1.5;
  max-width: 240px;
  margin-bottom: 48px;
}

/* Loading dots */
.loading-dots {
  display: flex;
  gap: 8px;
  align-items: center;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #E8DDD0;
}
.dot.active { background: #C8A96B; }
.dot.semi { background: rgba(200,169,107,0.4); }

.version {
  position: absolute;
  bottom: 28px;
  font-size: 11px;
  color: #C0AFA5;
  letter-spacing: 0.2px;
}

/* Decorative background dots grid — subtle */
.bg-grid {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  overflow: hidden;
  pointer-events: none;
  opacity: 0.4;
}
</style>
</head>
<body>

<!-- Background subtle texture -->
<svg class="bg-grid" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid meet">
  <!-- Corner decorations -->
  <g opacity="0.5">
    <!-- TL -->
    <path d="M24 50 L24 24 L50 24" stroke="#C8A96B" stroke-width="1.5" fill="none"/>
    <circle cx="24" cy="37" r="2" fill="#C8A96B"/>
    <circle cx="37" cy="24" r="2" fill="#C8A96B"/>
    <!-- TR -->
    <path d="M366 50 L366 24 L340 24" stroke="#C8A96B" stroke-width="1.5" fill="none"/>
    <circle cx="366" cy="37" r="2" fill="#C8A96B"/>
    <circle cx="353" cy="24" r="2" fill="#C8A96B"/>
    <!-- BL -->
    <path d="M24 794 L24 820 L50 820" stroke="#C8A96B" stroke-width="1.5" fill="none"/>
    <circle cx="24" cy="807" r="2" fill="#C8A96B"/>
    <circle cx="37" cy="820" r="2" fill="#C8A96B"/>
    <!-- BR -->
    <path d="M366 794 L366 820 L340 820" stroke="#C8A96B" stroke-width="1.5" fill="none"/>
    <circle cx="366" cy="807" r="2" fill="#C8A96B"/>
    <circle cx="353" cy="820" r="2" fill="#C8A96B"/>
  </g>
  <!-- Subtle dot grid -->
  <g opacity="0.3">
    <circle cx="40" cy="200" r="1.5" fill="#C8A96B"/>
    <circle cx="80" cy="160" r="1" fill="#C8A96B"/>
    <circle cx="350" cy="200" r="1.5" fill="#C8A96B"/>
    <circle cx="310" cy="160" r="1" fill="#C8A96B"/>
    <circle cx="40" cy="640" r="1.5" fill="#C8A96B"/>
    <circle cx="350" cy="640" r="1.5" fill="#C8A96B"/>
  </g>
</svg>

<div class="hero">
  <div class="lotus-ring">
    <!-- Vepari lotus mandala -->
    <svg class="lotus-icon" width="72" height="72" viewBox="0 0 72 72" fill="none">
      <!-- Outer petals -->
      <path d="M36 10 C46 20 46 30 36 34 C26 30 26 20 36 10" fill="#C8A96B" opacity="0.9"/>
      <path d="M62 36 C52 46 42 46 38 36 C42 26 52 26 62 36" fill="#C8A96B" opacity="0.9"/>
      <path d="M36 62 C26 52 26 42 36 38 C46 42 46 52 36 62" fill="#C8A96B" opacity="0.9"/>
      <path d="M10 36 C20 26 30 26 34 36 C30 46 20 46 10 36" fill="#C8A96B" opacity="0.9"/>
      <!-- Diagonal petals (lighter) -->
      <path d="M56 16 C50 28 42 32 36 28 C38 20 46 14 56 16" fill="#C8A96B" opacity="0.5"/>
      <path d="M56 56 C44 50 40 42 44 36 C52 38 58 46 56 56" fill="#C8A96B" opacity="0.5"/>
      <path d="M16 56 C22 44 30 40 36 44 C34 52 26 58 16 56" fill="#C8A96B" opacity="0.5"/>
      <path d="M16 16 C28 22 32 30 28 36 C20 34 14 26 16 16" fill="#C8A96B" opacity="0.5"/>
      <!-- Center circle -->
      <circle cx="36" cy="36" r="8" fill="#C8A96B"/>
      <circle cx="36" cy="36" r="4" fill="#FAF7F2"/>
      <circle cx="36" cy="36" r="2" fill="#C8A96B"/>
    </svg>
  </div>

  <div class="wordmark">VEPARI AI</div>
  <div class="tagline-sub">Business OS</div>

  <div class="tagline-main">Awakening your<br>Business Intelligence</div>

  <div class="loading-dots">
    <div class="dot active"></div>
    <div class="dot semi"></div>
    <div class="dot"></div>
  </div>
</div>

<div class="version">v1.0 · Vepari AI</div>
</body>
</html>
