<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 390px; height: 844px;
  font-family: system-ui, -apple-system, sans-serif;
  background: #ffffff; color: #171717;
  overflow: hidden;
}
body { display: flex; flex-direction: column; }

.header {
  flex: 0 0 300px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 0 24px;
}
.title { font-size: 22px; font-weight: 700; }
.sub { margin-top: 6px; font-size: 14px; color: #737373; }
.pin-dots {
  margin-top: 32px;
  display: flex; gap: 14px;
}
.dot {
  width: 18px; height: 18px; border-radius: 50%;
  background: #e5e5e5; border: 2px solid #d4d4d4;
}
.dot.filled { background: #2563eb; border-color: #1d4ed8; }
.error-hint {
  margin-top: 12px;
  font-size: 13px; color: #dc2626;
  min-height: 18px;
}

.bottom {
  flex: 1;
  display: flex; flex-direction: column;
  padding: 4px 20px 36px;
}
.keypad {
  flex: 1;
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; align-content: start; padding-top: 4px;
}
.key {
  height: 64px;
  background: #f5f5f5; border: 1px solid #e5e5e5;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 500;
}
.key.empty { background: transparent; border-color: transparent; }
.key.del { font-size: 17px; color: #737373; }
.forgot {
  text-align: center;
  padding-top: 14px;
  font-size: 14px; color: #2563eb; font-weight: 500;
}
</style>

<div class="header">
  <div class="title">Enter your PIN</div>
  <div class="sub">[Business Name]</div>
  <div class="pin-dots">
    <div class="dot filled"></div>
    <div class="dot filled"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <!-- Error state (shown after wrong PIN attempt): -->
  <div class="error-hint"><!-- Incorrect PIN — 4 attempts remaining --></div>
</div>

<div class="bottom">
  <div class="keypad">
    <div class="key">1</div>
    <div class="key">2</div>
    <div class="key">3</div>
    <div class="key">4</div>
    <div class="key">5</div>
    <div class="key">6</div>
    <div class="key">7</div>
    <div class="key">8</div>
    <div class="key">9</div>
    <div class="key empty"></div>
    <div class="key">0</div>
    <div class="key del">⌫</div>
  </div>
  <div class="forgot">Forgot PIN?</div>
</div>
