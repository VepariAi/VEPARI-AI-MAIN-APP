<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 390px; height: 844px;
  font-family: system-ui, -apple-system, sans-serif;
  background: #ffffff; color: #171717;
  overflow: hidden;
}
body { display: flex; flex-direction: column; }
.top-bar {
  padding: 16px 20px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid #f0f0f0;
}
.back {
  width: 32px; height: 32px;
  border: 1px solid #e5e5e5; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: #737373;
}
.biz-name { font-size: 16px; font-weight: 600; }
.content {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 0 28px 60px;
  gap: 0;
}
.bio-ring {
  width: 128px; height: 128px; border-radius: 64px;
  background: #fef2f2; border: 3px solid #fca5a5;
  display: flex; align-items: center; justify-content: center;
}
.bio-inner {
  width: 100px; height: 100px; border-radius: 50px;
  background: #fee2e2; border: 2px dashed #f87171;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; color: #dc2626;
}
.error-msg {
  margin-top: 20px;
  font-size: 17px; font-weight: 600; color: #dc2626;
}
.attempts {
  margin-top: 6px;
  font-size: 14px; color: #737373;
}
.retry-btn {
  margin-top: 32px; width: 100%;
  padding: 15px;
  background: #2563eb; color: #fff;
  border: none; border-radius: 12px;
  font-size: 16px; font-weight: 600;
}
.divider {
  width: 100%; margin: 24px 0;
  border: none; border-top: 1px solid #e5e5e5;
}
.pin-link { font-size: 15px; color: #2563eb; font-weight: 500; }
.auto-note {
  margin-top: 20px; width: 100%;
  padding: 12px 14px;
  background: #fef9ec; border: 1px solid #fcd34d;
  border-radius: 8px;
}
.auto-note p { font-size: 12px; color: #78350f; line-height: 1.5; }
.auto-note strong { font-weight: 600; }
</style>

<div class="top-bar">
  <div class="back">←</div>
  <div class="biz-name">[Business Name]</div>
</div>

<div class="content">
  <div class="bio-ring">
    <div class="bio-inner">✕</div>
  </div>

  <div class="error-msg">⚠ Not recognized</div>
  <div class="attempts">2 attempts remaining</div>

  <button class="retry-btn">Try again</button>

  <hr class="divider">

  <div class="pin-link">Use PIN instead</div>

  <div class="auto-note">
    <p>
      <strong>After 3rd fail:</strong> Biometric blocked for this session.
      PIN entry opens automatically. Biometric re-enabled on next app launch.
    </p>
  </div>
</div>
