<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Voice Active</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 390px; height: 844px;
  font-family: 'Inter', system-ui, sans-serif;
  background: #FAF7F2; color: #3B2F2A;
  overflow: hidden; display: flex; flex-direction: column;
}
.status-bar { height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 11px; color: #8A7060; }
.screen-header { height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #EDE5D8; }
.back-btn { font-size: 20px; color: #C8A96B; width: 32px; }
.header-center { display: flex; flex-direction: column; align-items: center; }
.header-title { font-size: 15px; font-weight: 700; }
.header-sub { font-size: 10px; color: #5A6B4F; font-weight: 600; }
.header-action { font-size: 16px; color: #C8A96B; width: 32px; text-align: right; }

/* Voice active area */
.voice-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 32px; }

/* Waveform ring */
.ring-wrap { position: relative; width: 200px; height: 200px; flex-shrink: 0; }
.ring-bg { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(200,169,107,0.15); }
.ring-pulse-1 { position: absolute; inset: -16px; border-radius: 50%; border: 1.5px solid rgba(200,169,107,0.20); animation: pulse 2s ease-in-out infinite; }
.ring-pulse-2 { position: absolute; inset: -32px; border-radius: 50%; border: 1px solid rgba(200,169,107,0.10); animation: pulse 2s ease-in-out infinite 0.4s; }
@keyframes pulse { 0%,100%{opacity:0.4;transform:scale(1)} 50%{opacity:1;transform:scale(1.04)} }
.ring-inner { position: absolute; inset: 12px; border-radius: 50%; background: linear-gradient(135deg, #3B2F2A 0%, #4A3D6B 100%); display: flex; align-items: center; justify-content: center; }
.mic-icon { font-size: 44px; }

/* Waveform bars around ring (decorative) */
.waveform-bars { position: absolute; inset: -8px; border-radius: 50%; }
.w-bar { position: absolute; bottom: 50%; left: 50%; width: 3px; border-radius: 2px; background: #C8A96B; transform-origin: bottom center; }

/* Transcript bubble */
.transcript { background: #FFFFFF; border: 1.5px solid #EDE5D8; border-radius: 16px; padding: 14px 16px; width: 100%; max-width: 320px; }
.tr-label { font-size: 9px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #C8A96B; margin-bottom: 6px; }
.tr-text { font-size: 15px; font-weight: 500; color: #3B2F2A; line-height: 1.5; }
.tr-cursor { display: inline-block; width: 2px; height: 14px; background: #C8A96B; margin-left: 2px; vertical-align: middle; animation: blink 1s steps(1) infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* Status label */
.voice-status { font-size: 13px; color: #8A7060; display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #5A6B4F; animation: pulse 1.5s ease-in-out infinite; }

/* AI response card (appears after listening) */
.ai-response { background: #FFFFFF; border: 1.5px solid #EDE5D8; border-radius: 16px; padding: 14px 16px; width: 100%; max-width: 320px; }
.ar-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.ar-dot { width: 6px; height: 6px; border-radius: 50%; background: #C8A96B; }
.ar-name { font-size: 10px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: #C8A96B; }
.ar-text { font-size: 13px; color: #3B2F2A; line-height: 1.6; }
.ar-text strong { color: #5A6B4F; }
.ar-pills { display: flex; gap: 6px; margin-top: 10px; }
.ar-pill { padding: 5px 10px; border-radius: 10px; background: rgba(200,169,107,0.12); font-size: 11px; font-weight: 600; color: #8A7060; }

/* Controls bar */
.voice-controls { display: flex; align-items: center; justify-content: center; gap: 24px; padding: 16px 0; }
.ctrl-btn { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.ctrl-btn.secondary { background: #F2E8D6; border: 1.5px solid #E8DDD0; }
.ctrl-main { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #3B2F2A 0%, #4A3D6B 100%); border: 3px solid #C8A96B; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 0 0 6px rgba(200,169,107,0.15); }

/* Input bar (collapsed during voice) */
.input-bar { height: 64px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #EDE5D8; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.input-field { flex: 1; height: 40px; background: #FAF7F2; border: 1.5px solid #EDE5D8; border-radius: 20px; padding: 0 14px; display: flex; align-items: center; }
.input-placeholder { font-size: 13px; color: #C0AFA5; }

/* Waveform SVG bars (positioned radially around mic) */
.waveform { display: flex; align-items: center; justify-content: center; gap: 3px; height: 40px; margin-top: 4px; }
.wf-bar { width: 3px; border-radius: 2px; background: #C8A96B; opacity: 0.8; }
</style>
</head>
<body>

<div class="status-bar">
  <span>9:41</span>
  <span style="display:flex;gap:4px;align-items:center;"><span>▲▲▲</span><span>WiFi</span><span>🔋</span></span>
</div>
<div class="screen-header">
  <div class="back-btn">‹</div>
  <div class="header-center">
    <div class="header-title">Ask Vepari AI</div>
    <div class="header-sub">● Listening…</div>
  </div>
  <div class="header-action">✕</div>
</div>

<div class="voice-area">

  <!-- Pulsing mic ring -->
  <div class="ring-wrap">
    <div class="ring-pulse-2"></div>
    <div class="ring-pulse-1"></div>
    <div class="ring-bg"></div>
    <div class="ring-inner">
      <div class="mic-icon">🎙️</div>
    </div>
  </div>

  <!-- Live waveform bars (showing audio input) -->
  <div class="waveform">
    <div class="wf-bar" style="height:12px;"></div>
    <div class="wf-bar" style="height:24px;"></div>
    <div class="wf-bar" style="height:18px;"></div>
    <div class="wf-bar" style="height:32px;"></div>
    <div class="wf-bar" style="height:20px;"></div>
    <div class="wf-bar" style="height:28px;"></div>
    <div class="wf-bar" style="height:14px;"></div>
    <div class="wf-bar" style="height:36px;"></div>
    <div class="wf-bar" style="height:22px;"></div>
    <div class="wf-bar" style="height:16px;"></div>
    <div class="wf-bar" style="height:30px;"></div>
    <div class="wf-bar" style="height:10px;"></div>
  </div>

  <!-- Live transcript -->
  <div class="transcript">
    <div class="tr-label">You're saying</div>
    <div class="tr-text">Aaj ka total sale kitna hua?<span class="tr-cursor"></span></div>
  </div>

  <!-- Listening status -->
  <div class="voice-status">
    <div class="status-dot"></div>
    Listening — speak clearly in Hindi or English
  </div>

  <!-- Controls -->
  <div class="voice-controls">
    <div class="ctrl-btn secondary">⌨️</div>
    <div class="ctrl-main">🎙️</div>
    <div class="ctrl-btn secondary">📋</div>
  </div>

</div>

<div class="input-bar">
  <div class="input-field"><div class="input-placeholder">Or type your question…</div></div>
</div>

</body>
</html>
